[package]
name = "mcp-herald"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["StudioMeyer <hello@studiomeyer.io>"]
description = "Static migration linter for the MCP 2026-07-28 spec. Scans your server source for breaking-change signatures — the -32002 error code, stateful sessions, deprecated roots/sampling/logging, missing OAuth resource metadata — and tells you what to change before the deadline."
repository = "https://github.com/studiomeyer-io/mcp-herald"
homepage = "https://github.com/studiomeyer-io/mcp-herald"
readme = "README.md"
keywords = ["mcp", "model-context", "linter", "migration", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mcp_herald"
path = "src/lib.rs"

[[bin]]
name = "mcp-herald"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
opt-level = 3
